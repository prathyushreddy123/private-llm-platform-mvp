version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm-platform-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "ollama"
      com.llm-platform.component: "inference"

  chroma:
    image: chromadb/chroma:latest
    container_name: llm-platform-chroma
    volumes:
      - chroma-data:/chroma/data
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/data/auth.json
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "chroma"
      com.llm-platform.component: "vector-store"

  postgres:
    image: postgres:15-alpine
    container_name: llm-platform-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backup:/backups
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "postgres"
      com.llm-platform.component: "database"

  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: llm-platform-pgbouncer
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_POOL_MODE=transaction
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "pgbouncer"
      com.llm-platform.component: "connection-pooling"

  n8n:
    image: n8nio/n8n:latest
    container_name: llm-platform-n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=pgbouncer
      - DB_POSTGRESDB_PORT=6432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${N8N_DB_SCHEMA}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_PATH=/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_CUSTOM_EXTENSIONS=/custom-extensions
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/custom-extensions:/custom-extensions
    depends_on:
      - pgbouncer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "n8n"
      com.llm-platform.component: "workflow-automation"

  redis:
    image: redis:7-alpine
    container_name: llm-platform-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "redis"
      com.llm-platform.component: "cache"

  streamlit:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: llm-platform-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../frontend:/app
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - CHROMA_API_URL=http://chroma:8000
      - N8N_API_URL=http://n8n:5678
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - chroma
      - n8n
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.llm-platform.service: "streamlit"
      com.llm-platform.component: "frontend"

networks:
  default:
    name: llm-platform-network
    driver: bridge
volumes:
  ollama-data:
    driver: local
  chroma-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/chroma
  postgres-data:
    driver: local
  postgres-backup:
    driver: local
  n8n-data:
    driver: local
  redis-data:
    driver: local

