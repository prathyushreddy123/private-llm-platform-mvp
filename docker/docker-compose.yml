version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm-platform-ollama
    volumes:
      - /mnt/legal/data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: llm-platform-chroma
    volumes:
      - /mnt/legal/data/chroma:/chroma/data
    ports:
      - "8000:8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/data/auth.json
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: llm-platform-postgres
    volumes:
      - /mnt/legal/data/postgres:/var/lib/postgresql/data
      - /mnt/legal/data/postgres-backup:/backups
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped

  init-n8n-db:
    image: postgres:15-alpine
    depends_on:
      - postgres
    entrypoint: >
      sh -c "
      until pg_isready -h postgres -U $$POSTGRES_USER; do
        echo 'Waiting for postgres...';
        sleep 2;
      done;
      psql -h postgres -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE llm_n8n\" || true;
      "
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme


  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: llm-platform-pgbouncer
    environment:
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - PGBOUNCER_PORT=6432
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_POOL_MODE=transaction
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: llm-platform-n8n
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=pgbouncer
      - DB_POSTGRESDB_PORT=6432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=${N8N_DB_SCHEMA}
    volumes:
      - /mnt/legal/data/n8n:/home/node/.n8n
      - ./n8n/custom-extensions:/custom-extensions
    depends_on:
      - pgbouncer
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm-platform-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - /mnt/legal/data/redis:/data
    restart: unless-stopped

  streamlit:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    container_name: llm-platform-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../frontend:/app
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - CHROMA_API_URL=http://chroma:8000
      - N8N_API_URL=http://n8n:5678
      - REDIS_URL=redis://redis:6379
    depends_on:
      - ollama
      - chroma
      - n8n
      - redis
    restart: unless-stopped

networks:
  default:
    name: llm-platform-network
    driver: bridge
